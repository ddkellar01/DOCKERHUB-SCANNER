name: DOCKERHUB-SCANNER Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Scanner Tools (Trivy & ClamAV)
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam trivy

      - name: Fix Line Endings Across All Python Files
        run: |
          find "$GITHUB_WORKSPACE/src" -type f -name "*.py" -exec sed -i -e 's/\r$//' {} +

      - name: Execute DOCKERHUB-SCANNER
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$GITHUB_WORKSPACE/src/scanner.py" credkellar/dockerhub-scanner:latest
