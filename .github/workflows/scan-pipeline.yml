name: DOCKERHUB-SCANNER Pipeline

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker Hub image to scan (e.g., redis:latest)'
        required: true
        default: 'library/alpine:latest'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Scanner Tools (Trivy & ClamAV)
        run: |
          sudo apt-get update && sudo apt-get install -y clamav
          sudo freshclam || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Execute DOCKERHUB-SCANNER
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/scanner.py ${{ github.event.inputs.image_name }}

      # --- OPTIONAL: Push to Docker Hub if scan passes ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Verified Image
        run: |
          docker tag ${{ github.event.inputs.image_name }} ${{ secrets.DOCKERHUB_USERNAME }}/verified-scanned-image:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/verified-scanned-image:latest
