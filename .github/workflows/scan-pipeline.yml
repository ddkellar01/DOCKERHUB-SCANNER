name: DOCKERHUB-SCANNER Pipeline

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker Hub image to scan (e.g., redis:latest)'
        required: true
        default: 'library/alpine:latest'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug Workspace Files
        run: |
          echo "Current working directory:"
          pwd
          echo "Repository files structure:"
          find . -maxdepth 3 -not -path '*/.*'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Install Scanner Tools (Trivy & ClamAV)
        run: |
          sudo apt-get update && sudo apt-get install -y clamav
          sudo freshclam || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Execute DOCKERHUB-SCANNER
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Automatically detects scanner.py location (root or src/)
          if [ -f "src/scanner.py" ]; then
            python src/scanner.py "${{ github.event.inputs.image_name }}"
          elif [ -f "scanner.py" ]; then
            python scanner.py "${{ github.event.inputs.image_name }}"
          else
            echo "[!] Error: scanner.py not found in root or src/ directory."
            exit 1
          fi
